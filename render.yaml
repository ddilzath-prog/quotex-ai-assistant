services:
  - type: web
    name: binance-futures-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: MIN_CONFIDENCE
        value: "80"
      - key: MAX_HISTORY
        value: "5"